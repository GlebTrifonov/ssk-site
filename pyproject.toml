[project]
name = "ssk-site"
version = "0.1.0"
description = "Сайт-визитка для строительной компании"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "django-environ>=0.14.0",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"

[tool.ruff]
extend-exclude = ["*/migrations/*"]
