{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}SSK-Teplo{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <a class="navbar-brand" href="{% url 'home' %}"><img src="{% static 'img/logo.jpg' %}" alt="СанСтройКап" height="40" class="me-2 align-middle">СанСтройКап</a>

          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav">
            <a class="nav-link" href="#">Услуги</a>
            <a class="nav-link" href="#">Объекты</a>
            <a class="nav-link" href="#">Отзывы</a>
            <a class="nav-link" href="#">Контакты</a>
          </div>
        </div>
      </div>
    </nav>
    {% block content %}{% endblock %}
    <footer class="py-3 my-4">
      <ul class="nav justify-content-center border-bottom pb-3 mb-3">
        <li class="nav-item">
          <a href="tel:+375298308649" class="nav-link px-2 text-body-secondary">Телефон: +375 (29) 830-86-49</a>
        </li>
        <li class="nav-item">
          <span class="nav-link px-2 text-body-secondary">Почта: <span class="user-select-all">ssk-teplo@mail.ru</span></span>

        </li>
      </ul>
      <p class="text-center text-body-secondary">© {% now "Y" %} «СанСтройКап»</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
